server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # API — proxy to NestJS (no path rewrite, routes stay as-is)
    location ~ ^/(health|auth|me|v1|organizations|projects|features|analytics|funnels|retention|recommendations|analysis-runs|analysis-schedule|platform-health|data-deletion|internal) {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web — everything else goes to Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
